
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXTORIA – Your future begins here</title>
<style>
body{margin:0;overflow:hidden;font-family:Arial}
#start{position:absolute;inset:0;background:linear-gradient(#123b65,#071525);color:white;display:flex;align-items:center;justify-content:center;text-align:center;z-index:10}
#start button{padding:15px 25px;background:#f5bd32;border:0;border-radius:10px;font-size:18px}
#hud{position:absolute;top:10px;left:10px;background:#111d;color:white;padding:12px;border-radius:12px;z-index:3;line-height:1.6}
#hud button,#shop button{padding:9px;margin:4px;border:0;border-radius:7px;background:#1769aa;color:white}
#help{position:absolute;bottom:10px;left:10px;background:#111d;color:white;padding:10px;border-radius:10px;z-index:3}
#shop{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;color:#222;padding:20px;border-radius:15px;width:330px;max-height:75vh;overflow:auto;z-index:5;box-sizing:border-box}
#shop .close{background:#444}
#message{color:green;font-weight:bold}
</style>
</head>
<body>

<div id="start">
 <div>
  <h1>🌍 NEXTORIA – Your future begins here</h1>
  <h2>Your city. Your choices. Your story.</h2>
  <button onclick="startGame()">START LIFE NOW</button>
 </div>
</div>

<div id="hud" style="display:none">
 <b>🌍 NEXTORIA – Your future begins here</b><br>
 Character: Chukwudi<br>
 Money: ₦<span id="money">5,000,000</span><br>
 <button onclick="showInventory()">🎒 Inventory</button>
</div>

<div id="help" style="display:none">
 W A S D = Move / Drive<br>
 E = Enter car or open shop
</div>

<div id="shop">
 <h2 id="shopTitle"></h2>
 <p id="shopDescription"></p>
 <div id="shopItems"></div>
 <p id="message"></p>
 <button class="close" onclick="closeShop()">Close</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
let scene,camera,renderer,player,car,playerBody;
let money=5000000,inventory=[],carsOwned=[];
let driving=false,shopOpen=false,gameStarted=false;
let keys={},doors=[],currentShop=null;

const food=[
 ["Bread",1500],["Milk",2500],["Soft drink",1000],
 ["Rice",8000],["Biscuits",1200],["Chocolate",1800],
 ["Water",500],["Cooking oil",4500]
];

const clothes=[
 ["Blue T-shirt",12000,0x1769aa],
 ["Red T-shirt",12000,0xcc2222],
 ["Black T-shirt",15000,0x171717],
 ["White T-shirt",15000,0xffffff],
 ["Designer trousers",25000,0x333355],
 ["Sneakers",35000,0xffffff],
 ["Black cap",8000,0x111111]
];

const dealership=[
 ["NTRUDER Sedan",2500000,0x1769dd],
 ["NTRUDER Sport",4000000,0xcc2222],
 ["NTRUDER SUV",5000000,0x222222]
];

function startGame(){
 document.getElementById("start").style.display="none";
 document.getElementById("hud").style.display="block";
 document.getElementById("help").style.display="block";
 makeCity();
 gameStarted=true;
}

function box(x,y,z,w,h,d,color){
 let m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color:color})
 );
 m.position.set(x,y,z);
 scene.add(m);
 return m;
}

function buildShop(x,z,color,name,label){
 box(x,3,z,15,6,12,color);
 box(x,6.3,z,16,.7,13,0x1769aa);

 // Front sign
 box(x,5.4,z+6.1,11,1.1,.3,0xffd43b);

 let door=new THREE.Group();
 door.position.set(x,0,z+6.15);

 let panel=new THREE.Mesh(
  new THREE.BoxGeometry(2.5,2.5,.2),
  new THREE.MeshStandardMaterial({color:0x42a5f5})
 );
 panel.position.y=1.25;
 door.add(panel);
 scene.add(door);

 doors.push({object:door,name:name,label:label});

 // Windows
 box(x-5,2.7,z+6.1,3,2.5,.2,0x7bd8ed);
 box(x+5,2.7,z+6.1,3,2.5,.2,0x7bd8ed);
}

function makeCar(color){
 let g=new THREE.Group();
 let body=new THREE.Mesh(
  new THREE.BoxGeometry(2.5,.8,4),
  new THREE.MeshStandardMaterial({color:color})
 );
 body.position.y=.8;
 g.add(body);

 let roof=new THREE.Mesh(
  new THREE.BoxGeometry(1.8,.8,2),
  new THREE.MeshStandardMaterial({color:color})
 );
 roof.position.set(0,1.5,-.2);
 g.add(roof);

 for(let x of [-1.2,1.2]){
  for(let z of [-1.3,1.3]){
   let wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.4,.4,.25,16),
    new THREE.MeshStandardMaterial({color:0x111111})
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.5,z);
   g.add(wheel);
  }
 }
 return g;
}

function makeCity(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x87ceeb);

 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));
 let sun=new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(10,20,10);
 scene.add(sun);

 box(0,-.5,0,200,1,200,0x399b45);

 // Main street
 box(0,.02,0,200,.05,14,0x333333);
 box(0,.05,0,200,.02,.2,0xffffff);

 // Side street
 box(0,.02,25,14,.05,150,0x333333);

 // Six houses
 for(let i=0;i<6;i++){
  let x=-48+i*13;
  box(x,3,-35,9,6,9,0xe6a15b);
  box(x,6.5,-35,10,1,10,0x9b2929);
 }

 // Three shops on the same street
 buildShop(-30,-12,0xe8e8e8,"supermarket","DELTA SUPERMARKET");
 buildShop(0,-12,0xe7b8d1,"fashion","DELTA FASHION STORE");
 buildShop(30,-12,0xcccccc,"autos","NTRUDER AUTOS");

 // Supermarket shelves
 for(let i=0;i<3;i++){
  box(-35+i*5,1,-10,1,2,3,0x754c24);
  box(-35+i*5,2,-8.5,.7,.5,.5,0xff3333);
 }

 // Fashion display
 for(let i=0;i<4;i++){
  box(-7+i*4,1.5,-10,.7,3,1,0x754c24);
  box(-7+i*4,2.5,-9.4,1,1,.3,
  [0xff3333,0x1769aa,0xffffff,0x111111][i]);
 }

 // NTRUDER AUTOS display vehicles
 let display1=makeCar(0x1769dd);
 display1.position.set(26,0,-22);
 scene.add(display1);

 let display2=makeCar(0xcc2222);
 display2.position.set(34,0,-22);
 scene.add(display2);

 // Character
 player=new THREE.Group();

 playerBody=new THREE.Mesh(
  new THREE.BoxGeometry(.8,1.3,.5),
  new THREE.MeshStandardMaterial({color:0x1769aa})
 );
 playerBody.position.y=1;
 player.add(playerBody);

 let head=new THREE.Mesh(
  new THREE.SphereGeometry(.42,16,16),
  new THREE.MeshStandardMaterial({color:0x8b542f})
 );
 head.position.y=2;
 player.add(head);

 let hair=new THREE.Mesh(
  new THREE.SphereGeometry(.43,16,16),
  new THREE.MeshStandardMaterial({color:0x17110e})
 );
 hair.scale.y=.45;
 hair.position.y=2.25;
 player.add(hair);

 player.position.set(0,0,5);
 scene.add(player);

 car=makeCar(0x0759dd);
 car.position.set(5,0,5);
 scene.add(car);

 camera.position.set(0,12,25);
 camera.lookAt(0,0,-10);

 animate();
}

function distance(a,b){
 return a.position.distanceTo(b.position);
}

function openShop(type){
 shopOpen=true;
 currentShop=type;
 document.getElementById("shop").style.display="block";
 document.getElementById("message").innerText="";
 let html="";

 if(type==="supermarket"){
  document.getElementById("shopTitle").innerText="🛒 DELTA SUPERMARKET";
  document.getElementById("shopDescription").innerText="Buy food and drinks.";
  food.forEach((p,i)=>{
   html+=`<p>${p[0]} — ₦${p[1].toLocaleString()} <button onclick="buyFood(${i})">Buy</button></p>`;
  });
 }

 if(type==="fashion"){
  document.getElementById("shopTitle").innerText="👕 DELTA FASHION STORE";
  document.getElementById("shopDescription").innerText="Choose Chukwudi's new style.";
  clothes.forEach((p,i)=>{
   html+=`<p>${p[0]} — ₦${p[1].toLocaleString()} <button onclick="buyClothes(${i})">Buy</button></p>`;
  });
 }

 if(type==="autos"){
  document.getElementById("shopTitle").innerText="🚗 NTRUDER AUTOS";
  document.getElementById("shopDescription").innerText="Choose your next ride.";
  dealership.forEach((p,i)=>{
   html+=`<p>${p[0]} — ₦${p[1].toLocaleString()} <button onclick="buyCar(${i})">Buy car</button></p>`;
  });
  html+=`<button onclick="sellCar()">Sell a purchased car</button>`;
 }

 document.getElementById("shopItems").innerHTML=html;
}

function buyFood(i){
 let p=food[i];
 if(money<p[1])return msg("Not enough Naira!");
 money-=p[1];
 inventory.push({name:p[0],price:p[1],type:"food"});
 updateMoney();
 msg(p[0]+" purchased!");
}

function buyClothes(i){
 let p=clothes[i];
 if(money<p[1])return msg("Not enough Naira!");
 money-=p[1];
 inventory.push({name:p[0],price:p[1],type:"clothes"});
 playerBody.material.color.setHex(p[2]);
 updateMoney();
 msg(p[0]+" purchased! Outfit changed.");
}

function buyCar(i){
 let p=dealership[i];
 if(money<p[1])return msg("Not enough Naira!");
 money-=p[1];
 let newCar=makeCar(p[2]);
 newCar.position.set(30+carsOwned.length*5,0,-25);
 scene.add(newCar);
 carsOwned.push({object:newCar,name:p[0],price:p[1]});
 updateMoney();
 msg(p[0]+" purchased! Find it near the dealership.");
}

function sellCar(){
 if(!carsOwned.length)return msg("You have no purchased cars to sell.");
 let c=carsOwned.pop();
 money+=Math.floor(c.price*.7);
 scene.remove(c.object);
 updateMoney();
 msg(c.name+" sold!");
}

function showInventory(){
 shopOpen=true;
 currentShop="inventory";
 document.getElementById("shop").style.display="block";
 document.getElementById("shopTitle").innerText="🎒 YOUR INVENTORY";
 document.getElementById("shopDescription").innerText="Items Chukwudi owns.";
 let html="";
 if(!inventory.length)html="<p>Your inventory is empty.</p>";
 inventory.forEach((p,i)=>{
  html+=`<p>${p.name} — ₦${p.price.toLocaleString()} <button onclick="sellItem(${i})">Sell</button></p>`;
 });
 document.getElementById("shopItems").innerHTML=html;
 document.getElementById("message").innerText="";
}

function sellItem(i){
 let p=inventory[i];
 money+=Math.floor(p.price*.7);
 inventory.splice(i,1);
 updateMoney();
 showInventory();
 msg("Item sold!");
}

function msg(t){
 document.getElementById("message").innerText=t;
}

function updateMoney(){
 document.getElementById("money").innerText=money.toLocaleString();
}

function closeShop(){
 shopOpen=false;
 currentShop=null;
 document.getElementById("shop").style.display="none";
}

document.addEventListener("keydown",e=>{
 let k=e.key.toLowerCase();
 keys[k]=true;

 if(k==="e" && gameStarted && !shopOpen){
  if(!driving && distance(player,car)<4){
   driving=true;
   player.visible=false;
   return;
  }
  if(driving){
   driving=false;
   player.visible=true;
   player.position.copy(car.position);
   player.position.x+=2;
   return;
  }

  let nearest=null,near=8;
  doors.forEach(d=>{
   let n=distance(player,d.object);
   if(n<near){near=n;nearest=d;}
  });
  if(nearest)openShop(nearest.name);
 }
});

document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function animate(){
 requestAnimationFrame(animate);

 if(gameStarted){
  let target=driving?car:player;
  if(driving){
   if(keys.w)car.translateZ(-.26);
   if(keys.s)car.translateZ(.13);
   if(keys.a)car.rotation.y+=.04;
   if(keys.d)car.rotation.y-=.04;
  }else if(!shopOpen){
   if(keys.w)player.translateZ(-.13);
   if(keys.s)player.translateZ(.13);
   if(keys.a)player.rotation.y+=.04;
   if(keys.d)player.rotation.y-=.04;
  }

  doors.forEach(d=>{
   d.object.rotation.y=(!driving && distance(player,d.object)<8)?.9:0;
  });

  let behind=new THREE.Vector3(0,7,12);
  behind.applyAxisAngle(new THREE.Vector3(0,1,0),target.rotation.y);
  camera.position.lerp(target.position.clone().add(behind),.08);
  camera.lookAt(target.position.x,target.position.y+1,target.position.z);
 }
 renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
